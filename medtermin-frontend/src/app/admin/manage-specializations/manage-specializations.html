<div class="container mt-4">
  <h2 class="mb-4">Upravljanje specijalizacijama</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">Dodaj novu specijalizaciju</h5>

      <form #specForm="ngForm" (ngSubmit)="onSubmit()" class="d-flex gap-2">
        <input
          type="text"
          class="form-control"
          name="specializationName"
          [(ngModel)]="newSpecializationName"
          placeholder="Npr. Neurologija"
          required
        >
        <button
          type="submit"
          class="btn btn-primary text-nowrap"
          [disabled]="specForm.invalid || isSubmitting"
        >
          @if (isSubmitting) {
            Dodavanje...
          } @else {
            Dodaj
          }
        </button>
      </form>

      @if (errorMessage) {
        <div class="alert alert-danger py-2 mt-2 mb-0">{{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="alert alert-success py-2 mt-2 mb-0">{{ successMessage }}</div>
      }
    </div>
  </div>

  <h5 class="mb-3">Postojeće specijalizacije</h5>

  @if (isLoading) {
    <p>Učitavanje...</p>
  } @else {
    <ul class="list-group">
      @for (spec of specializations; track spec.id) {
        <li class="list-group-item">{{ spec.name }}</li>
      }
    </ul>
  }

</div>
